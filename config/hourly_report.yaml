# -------------------------
# PAYOUT (Выплаты)
# -------------------------
# Структура:
# payout:
#   "<оригинальное имя партнёра из PayOut>":
#       <метод>:
#           title: "<как писать в отчёте>"
#           limit: <число или null>
#           vilka: "<текст вилки или null>"

payout:

  "HH (А-мобайл Сбер + Выплаты) (107)":
    title: "Амобайл"
    methods:
      UNI:
        limit: 5000000
        vilka: "ДО 100 К"
      BST:
        limit: null
        vilka: "на стопе КК"

  "HH (Abhsber IN + Выплаты) Тинь (117)":
    title: "АБХСбер"
    methods:
      UNI:
        limit: 5000000
        vilka: "5–100 К"


