window_minutes: 15              # ширина окна анализа
offset_minutes: 0              # смещение окна
success_window_minutes: 0      # окно подсчёта успехов
min_events: 10                 # анти-шум

# Минуты для выставления окна по зависшим операциям
# Дни для выставления периода скачивания файлов
pending_thresholds:
  payin_minutes: 10       # Поступления — более 10 минут
  payout_minutes: 180     # Выплаты — более 3 часов

download_periods:
