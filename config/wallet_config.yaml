# === ОБЩИЕ НАСТРОЙКИ ОКНА ===
window_minutes: 8              # ширина окна анализа
offset_minutes: 8              # смещение окна
success_window_minutes: 5      # окно подсчёта успехов
min_events: 10                 # анти-шум

# === ГРУППЫ ПАРТНЁРОВ (общий дневной лимит для группы) ===
groups:

  abhsber:
    daily_max_amount: 8_000_000     # общий лимит 8 млн
    partners:
      - "HH (Abhsber IN + Выплаты) Тинь"
      - "HH (Abhsber IN) Сбер"

  aurora:
    daily_max_amount: 5_000_000     # общий лимит 5 млн
    partners:
      - "HH (Аврора Тинь)"
      - "HH (Аврора Сбер)"

  kibit:
    daily_max_amount: 8_000_000     # общий лимит 8 млн
    partners:
      - "HH (Кибит Сбер)"
      - "HH (Кибит Тинь)"

# === ИНДИВИДУАЛЬНЫЕ ПАРТНЁРЫ (всё, что не принадлежит группам) ===
partners:

  "HH (А-мобайл Сбер + Выплаты)":
    threshold: 0.36
    daily_max_amount: 2_200_000
    api_cancel_threshold: 9         # проценты
    api_cancel_keyword: "Отмена по API"

  "HH (Амобайл Тинькофф)":
    threshold: 0.36
    daily_max_amount: 500_000
    api_cancel_threshold: 5
    api_cancel_keyword: "Отмена по API"

  "HH (Бакай Тинь)":
    threshold: 0.20
    daily_max_amount: 5_000_000
    api_cancel_threshold: 20
    api_cancel_keyword: "Отмена по API"
