#  Бот-Аналитика
#=== ОБЩИЕ НАСТРОЙКИ ОКНА ===
window_minutes: 15              # ширина окна анализа
offset_minutes: 120              # смещение окна
success_window_minutes: 0      # окно подсчёта успехов
min_events: 20                 # анти-шум

# Минуты для выставления окна по зависшим операциям
# Дни для выставления периода скачивания файлов
pending_thresholds:
  payin_minutes: 10       # Поступления — более 10 минут
  payout_minutes: 180     # Выплаты — более 3 часов

download_periods:
  payin_days_back: 0      # сегодня − 2
  payout_days_back: 0     # выплаты за неделю

# === ГРУППЫ ПАРТНЁРОВ (общий дневной лимит для группы) ===
groups:

  abhsber:
    partners:
      - "HH (Abhsber IN + Выплаты) Тинь (117)"
      - "HH (Abhsber IN) Сбер  (116)"

  aurora:
    partners:
      - "HH (Аврора Тинь) (108)"
      - "HH (Аврора Сбер) (109)"

  kibit:
    partners:
      - "HH (Кибит Сбер) (111)"
      - "HH (Кибит Тинь) (114)"

  vassl:
    partners:
      - "HH Вассл (Сбер сбп)"
      - "HH Вассл (ВТБ сбп)"
      - "HH Вассл (Тинь номер карты и сбп)"

# === ИНДИВИДУАЛЬНЫЕ ПАРТНЁРЫ (всё, что не принадлежит группам) ===
partners:

  "HH (А-мобайл Сбер + Выплаты) (107)":
    threshold: 0.50
    api_cancel_keyword: "Отмена по API"

  "HH (Амобайл Тинькофф) (113)":
    threshold: 0.45
    api_cancel_keyword: "Отмена по API"

  "HH (Бакай Тинь) (110)":
    threshold: 0.20
    api_cancel_keyword: "Отмена по API"

  "HH (Abhsber IN + Выплаты) Тинь (117)":
    threshold: 0.50
    api_cancel_keyword: "Отмена по API"

  "HH (Abhsber IN) Сбер  (116)":
