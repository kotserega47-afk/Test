# === ОБЩИЕ НАСТРОЙКИ ОКНА ===
window_minutes: 15              # ширина окна анализа
offset_minutes: 0              # смещение окна
success_window_minutes: 0      # окно подсчёта успехов
min_events: 20                 # анти-шум

# Минуты для выставления окна по зависшим операциям
# Дни для выставления периода скачивания файлов
pending_thresholds:
  payin_minutes: 10       # Поступления — более 10 минут
  payout_minutes: 180     # Выплаты — более 3 часов

download_periods:
  payin_days_back: 2      # сегодня − 2
  payout_days_back: 7     # выплаты за неделю

# === ГРУППЫ ПАРТНЁРОВ (общий дневной лимит для группы) ===
groups:

  abhsber:
    daily_max_amount: 8_500_000     # общий лимит 8,5 млн
    partners:
      - "HH (Abhsber IN + Выплаты) Тинь (117)"
      - "HH (Abhsber IN) Сбер  (116)"

  aurora:
    daily_max_amount: 5_000_000     # общий лимит 5 млн
    partners:
      - "HH (Аврора Тинь) (108)"
      - "HH (Аврора Сбер) (109)"

  kibit:
    daily_max_amount: 15_000_000     # общий лимит 15 млн
    partners:
      - "HH (Кибит Сбер) (111)"
      - "HH (Кибит Тинь) (114)"

  vassl:
    daily_max_amount: 1_000_000
    partners:
      - "HH Вассл (Сбер сбп)"
      - "HH Вассл (ВТБ сбп)"
      - "HH Вассл (Тинь номер карты и сбп)"

