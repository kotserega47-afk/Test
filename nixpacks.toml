[phases.setup]
aptPkgs = [
  "python3-venv",          # ← добавили
  "python3-pip",
  "libstdc++6",            # numpy/pandas wheels (libstdc++.so.6) + WalletEditor import chain
  "libnss3","libxss1","libasound2t64","libatk-bridge2.0-0","libgtk-3-0",
  "libdrm2","libxdamage1","libxcomposite1","libxrandr2","libgbm1",
  "libxkbcommon0","libpango-1.0-0","libcairo2","libatspi2.0-0",
  "libglib2.0-0","libgobject-2.0-0","libnspr4","libexpat1","libdbus-1-3",
  "fonts-liberation","libxext6","libxfixes3","libx11-6",
  "tzdata"
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/python -m pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
  "/opt/venv/bin/python -m playwright install chromium"
]