[services]
  [services.main]
    name = "file-analyzer"
    start = "python main.py"
    plan = "free"

[triggers]
  [triggers.cron]
    service = "file-analyzer"
    schedule = "*/5 * * * *"  # каждые 5 минут


[phases.setup]
aptPkgs = [
  "libnss3",
  "libxss1",
  "libasound2",
  "libatk-bridge2.0-0",
  "libgtk-3-0",
  "libdrm2",
  "libxdamage1",
  "libxcomposite1",
  "libxrandr2",
  "libgbm1",
  "libxkbcommon0",
  "libpango-1.0-0",
  "libcairo2",
  "libatspi2.0-0",
  "libglib2.0-0",
  "libgobject-2.0-0",
  "libnspr4",
  "libexpat1",
  "libdbus-1-3",
  "fonts-liberation",
  "libxext6",
  "libxfixes3",
  "libx11-6"
]
